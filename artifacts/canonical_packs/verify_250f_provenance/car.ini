[HEADER]
VERSION=extended-2 ; version number

[INFO]
SCREEN_NAME=Maserati 250F 6 cylinder
SHORT_NAME=Maserati 250F I6

[BASIC]
GRAPHICS_OFFSET=0,-0.45,-0.1	; 3 axis correction (x,y,z), applies only to the 3D object of the car. in meters
GRAPHICS_PITCH_ROTATION=0.5				; changes 3D object rotation in pitch
TOTALMASS=700			; total vehicle weight in kg with driver and no fuel
INERTIA=1.0,0.8,4.000				; car polar inertia. Calculated from the car dimensions. Just enter the generic width,height,

[GRAPHICS]
DRIVEREYES=0.003204,0.934045,-0.828344
ONBOARD_EXPOSURE=24
OUTBOARD_EXPOSURE=32
ON_BOARD_PITCH_ANGLE=-8.114383
BUMPER_CAMERA_POS=0.000000,0.430000,1.300001
BONNET_CAMERA_POS=0.000000,0.370000,0.000000
MIRROR_POSITION=0.0,0.6,0.5 ; Position used to render the mirror
VIRTUAL_MIRROR_ENABLED=1
SHAKE_MUL=5
USE_ANIMATED_SUSPENSIONS=1
FUEL_LIGHT_MIN_LITERS=10
BUMPER_CAMERA_PITCH=1.718748
BONNET_CAMERA_PITCH=0.032274
CHASE_CAMERA_PITCH=0

[CONTROLS]
FFMULT=6.342
STEER_ASSIST=1.000
STEER_LOCK=410					; Real car's steer lock from center to right
STEER_RATIO=18.0					; Steer ratio
LINEAR_STEER_ROD_RATIO=0.0025

[FUEL]
CONSUMPTION=0.0040				; fuel consumption. In one second the consumption is (rpm*gas*CONSUMPTION)/1000 litres
FUEL=30							; default starting fuel in litres
MAX_FUEL=200					; max fuel in litres

[FUELTANK]
POSITION=0,0.20,-1.800

[RIDE]
PICKUP_FRONT_HEIGHT=-0.340			; Height of the front ride height pickup point in meters WRT cg
PICKUP_REAR_HEIGHT=-0.310

[PIT_STOP]
TYRE_CHANGE_TIME_SEC=10            ; time spent to change each tyre
FUEL_LITER_TIME_SEC=0.6   ; time spent to put 1 lt of fuel inside the car
BODY_REPAIR_TIME_SEC=20    ; time spent to repair 10% of body damage
ENGINE_REPAIR_TIME_SEC=2  ; time spent to repair 10% of engine damage
SUSP_REPAIR_TIME_SEC=30   ; time spent to repair 10% of suspension damage
