[HEADER]
VERSION=extended-2 ; version number

[INFO]
SCREEN_NAME=Porsche 917 K						; Name of the car. Used on info apps ingame and to identify the car on servers etc.
SHORT_NAME=917 K

[BASIC]
GRAPHICS_OFFSET=0,-0.47,0.31				; 3 axis correction (x,y,z), applies only to the 3D object of the car (meters)
GRAPHICS_PITCH_ROTATION=0.5				; Changes 3D object rotation in pitch (degrees)
TOTALMASS=895							; Total vehicle weight in kg with driver and no fuel
INERTIA=1.6,0.9,3.1							; Car polar inertia. Calculated from the car dimensions. Start with the generic width,height,length and modify accordingly to the car's configuration 

[GRAPHICS]
DRIVEREYES=-0.134900,0.767358,0.307207
ONBOARD_EXPOSURE=17
OUTBOARD_EXPOSURE=31
ON_BOARD_PITCH_ANGLE=-2.243235
BUMPER_CAMERA_POS=0.000000,0.530000,1.919999
BONNET_CAMERA_POS=0.000000,0.350000,1.450000
MIRROR_POSITION=0.0,1.3,0.5 				; Position used to render the mirror
SHAKE_MUL=1.5								; Camera onboard G forces multiplier 
USE_ANIMATED_SUSPENSIONS=1					; Use animated suspensions (1) or not (0). Animated suspensions will not be updated in real time from setup changes.
FUEL_LIGHT_MIN_LITERS=10						; Minimum fuel load to activate the Fuel indicator icon
BUMPER_CAMERA_PITCH=0.000000
BONNET_CAMERA_PITCH=-2.864693
CHASE_CAMERA_PITCH=0						; chase camera pitch angle

[CONTROLS]
FFMULT=4.656
STEER_ASSIST=1.000
STEER_LOCK=360								; Real car's steer lock from center to right
STEER_RATIO=11.4							; Steer ratio
LINEAR_STEER_ROD_RATIO=0.0021				; Because of AC complex suspension geometry, you need to calculate manually the steer rod ratio
; Enter AC in dev app mode enabled
; Open SUSPENSIONS app
; turn your steering wheel by 90 degrees
; check the actual steer ratio value
; modify LINEAR_STEER_ROD_RATIO value until ingame steer ratio and car.ini STEER_RATIO values are similar

[FUEL]
CONSUMPTION=0.01000							; fuel consumption. In one second the consumption is (rpm*gas*CONSUMPTION)/1000 litres
FUEL=30										; default starting fuel in litres
MAX_FUEL=120									; max fuel in litres

[FUELTANK]
POSITION=0,-0.14,0.4					; Position of fuel tank from CoG in meters

[RIDE]
PICKUP_FRONT_HEIGHT=-0.340					; Height of the front ride height pickup point in meters WRT cg
PICKUP_REAR_HEIGHT=-0.340					; Height of the rear ride height pickup point in meters WRT cg
[RULES]
MIN_HEIGHT=0.0 								; meters minimum height rule front/rear

[PIT_STOP]
TYRE_CHANGE_TIME_SEC=10   		         	; time spent to change each tyre
FUEL_LITER_TIME_SEC=0.6  			; time spent to put 1 lt of fuel inside the car
BODY_REPAIR_TIME_SEC=20    			; time spent to repair 10% of body damage
ENGINE_REPAIR_TIME_SEC=2  			; time spent to repair 10% of engine damage
SUSP_REPAIR_TIME_SEC=30   			; time spent to repair 10% of suspension damage
