name: Release ACLM Tire Knowledge Sweep

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-knowledge-sweep.yml

permissions:
  contents: write

concurrency:
  group: release-knowledge-sweep
  cancel-in-progress: false

jobs:
  release-knowledge:
    runs-on: ubuntu-latest
    env:
      KNOWLEDGE_VERSION: 1.4.0
      BASE_VERSION: 1.3.0
      BASE_SHA256: 56dbc1f3cb3e9666df99e7ebda3a7a648e34e237aa06a3dd55ca468e26903c49
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build evidence-backed knowledge release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             "https://github.com/aclmproject/tire_lab/releases/download/knowledge-v$BASE_VERSION/ACLM_Tire_Knowledge_v$BASE_VERSION.json"             -o /tmp/base.json
          echo "$BASE_SHA256  /tmp/base.json" | sha256sum --check --strict

          cat > /tmp/research.b64 <<'B64'
          
          B64
          base64 --decode /tmp/research.b64 > /tmp/research.json

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["KNOWLEDGE_VERSION"]
          base = json.loads(Path("/tmp/base.json").read_text(encoding="utf-8-sig"))
          payload = json.loads(Path("/tmp/research.json").read_text(encoding="utf-8"))

          assert len(payload["researchIndex"]["classes"]) == 40
          assert len(payload["researchIndex"]["tracks"]) == 46
          assert len(payload["researchIndex"]["models"]) == 118
          assert len(payload["sources"]) == 29

          protected = [
              "classes",
              "families",
              "generatorPriors",
              "policy",
              "product",
              "profiles",
              "sourceMaster",
              "fitmentOverrides",
              "scalingRules",
          ]
          protected_before = {
              key: hashlib.sha256(
                  json.dumps(base.get(key), sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              ).hexdigest()
              for key in protected
          }

          data = dict(base)
          sources = dict(data.get("sources", {}))
          collisions = sorted(set(sources).intersection(payload["sources"]))
          if collisions:
              raise RuntimeError(f"Source ID collision: {collisions}")
          sources.update(payload["sources"])
          data["sources"] = sources
          data["researchIndex"] = payload["researchIndex"]
          data["releaseVersion"] = version
          published = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          data["publishedUtc"] = published
          notes = [
              "Large 1920-1999 historical gap sweep: 40 class eras, 46 tracks and 118 representative competition models.",
              "Adds AAA/USAC/CART/IRL, NASCAR, WRC, Can-Am/F5000, missing Formula 1 eras, Super Touring, JGTC, late Group C/IMSA WSC and GT1 context.",
              "Research-index entries are classification/context-only and do not promote unsourced tire physics or fitment.",
              "Track entries are historical context and are never automatic grip multipliers.",
          ]
          data["releaseNotes"] = notes + list(data.get("releaseNotes", []))

          protected_after = {
              key: hashlib.sha256(
                  json.dumps(data.get(key), sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              ).hexdigest()
              for key in protected
          }
          if protected_before != protected_after:
              raise RuntimeError("A protected calibrated section changed")

          content_view = {key: value for key, value in data.items() if key != "contentSha256"}
          canonical = json.dumps(
              content_view, sort_keys=True, separators=(",", ":"), ensure_ascii=False
          ).encode("utf-8")
          content_sha = hashlib.sha256(canonical).hexdigest()
          data["contentSha256"] = content_sha

          release_path = Path("knowledge/releases") / f"ACLM_Tire_Knowledge_v{version}.json"
          release_path.parent.mkdir(parents=True, exist_ok=True)
          release_path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          index_path = Path("knowledge/research-index-1920-1999.json")
          index_path.write_text(
              json.dumps(payload["researchIndex"], indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          raw_sha = hashlib.sha256(release_path.read_bytes()).hexdigest()
          manifest = {
              "product": "ACLM Tire Knowledge",
              "channel": "stable",
              "schema_version": data["schemaVersion"],
              "version": version,
              "file_name": release_path.name,
              "release_page": f"https://github.com/aclmproject/tire_lab/releases/tag/knowledge-v{version}",
              "download_url": f"https://github.com/aclmproject/tire_lab/releases/download/knowledge-v{version}/{release_path.name}",
              "sha256": raw_sha,
              "release_content_sha256": content_sha,
              "published_utc": published,
              "notes": "Evidence-backed 1920-1999 models, tracks and classes sweep. Classification/context only; existing calibrated tire physics remain unchanged.",
          }
          Path("knowledge/ACLM_Tire_Knowledge_latest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          Path("/tmp/knowledge_raw_sha").write_text(raw_sha, encoding="ascii")
          Path("/tmp/knowledge_content_sha").write_text(content_sha, encoding="ascii")
          Path("/tmp/knowledge_release_path").write_text(str(release_path), encoding="utf-8")
          print(json.dumps({
              "version": version,
              "raw_sha256": raw_sha,
              "content_sha256": content_sha,
              "classes": 40,
              "tracks": 46,
              "models": 118,
              "sources_added": 29,
              "protected_sections_unchanged": True,
          }, indent=2))
          PY

      - name: Commit knowledge v1.4.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/ACLM_Tire_Knowledge_latest.json             knowledge/releases/ACLM_Tire_Knowledge_v1.4.0.json             knowledge/research-index-1920-1999.json
          git commit -m "release: tire knowledge v1.4.0 historical sweep"
          git push origin HEAD:main

      - name: Publish knowledge v1.4.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          raw_sha="$(cat /tmp/knowledge_raw_sha)"
          content_sha="$(cat /tmp/knowledge_content_sha)"
          release_path="$(cat /tmp/knowledge_release_path)"
          gh release create "knowledge-v$KNOWLEDGE_VERSION" "$release_path"             --repo "${{ github.repository }}"             --target main             --title "ACLM Tire Knowledge v$KNOWLEDGE_VERSION"             --notes "1920-1999 historical gap sweep.

          Coverage added:
          - 40 class eras
          - 46 historic circuits across 19 countries
          - 118 representative competition models
          - 29 cited research sources

          Safety:
          - existing calibrated classes, families, profiles, priors, fitment overrides and scaling rules are unchanged
          - new research-index entries are classification/context-only
          - no unsourced tire sizes or physics values were promoted
          - track entries are not grip multipliers

          Raw SHA-256: $raw_sha
          Content SHA-256: $content_sha"             --latest=false
          gh release edit v0.5.5 --repo "${{ github.repository }}" --latest
