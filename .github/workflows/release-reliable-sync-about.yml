            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "ACLM Historical Tire Lab v$APP_VERSION" \
            --notes "Reliable sync, clean server lifecycle, and project methodology.

          - ordinary knowledge checks no longer force a full redownload
          - startup loads verified cached knowledge without making a network request
