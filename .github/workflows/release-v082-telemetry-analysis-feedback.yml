name: Release Tire Lab v0.8.2 Telemetry Analysis Feedback
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v082-telemetry-analysis-feedback.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  APP_VERSION: 0.8.2
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate telemetry analysis UI
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoLogo -NoProfile -File src/payload/Telemetry/ACLM_Native_Telemetry_Logger.ps1 -SelfTest
          pwsh -NoLogo -NoProfile -Command '& { $t=$null;$e=$null;[Management.Automation.Language.Parser]::ParseFile("src/payload/Server_ACLM_Tire_Lab.ps1",[ref]$t,[ref]$e)|Out-Null;if($e.Count){$e|ForEach-Object{Write-Error $_};exit 1} }'
          node --check src/payload/app/app.js
          node --check src/payload/app/telemetry_logger.js
          node --check src/payload/app/validation_core.js
          node --check src/payload/app/validation_workspace.js
          node --check src/payload/app/sw.js
          node --check tests/telemetry_ui_fixture_server.mjs
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window=global;global.performance={now:()=>0};
          vm.runInThisContext(fs.readFileSync('src/payload/app/validation_core.js','utf8'));
          const csv=fs.readFileSync('tests/fixtures/telemetry-sample.csv','utf8');
          const parsed=ACLMValidationCore.parseTelemetryCsv(csv);
          if(parsed.rows.length!==3||parsed.tempHeaders.length!==4||parsed.confidence!=='high'||parsed.summary.average!==66){
            throw new Error('telemetry fixture regression');
          }
          NODE
          python3 - <<'PY'
          from pathlib import Path
          html=Path('src/payload/app/index.html').read_text()
          logger=Path('src/payload/app/telemetry_logger.js').read_text()
          workspace=Path('src/payload/app/validation_workspace.js').read_text()
          assert '<b id="installedBuild">v0.8.2</b>' in html
          assert 'id="importTelemetryCsv"' in html
          assert 'id="nativeTelemetryActionStatus"' in html
          assert 'id="telemetryDetails"' in html
          assert 'nativeTelemetryActionStatus' in logger
          assert 'telemetryDetails' in logger and 'telemetryDetails' in workspace
          assert 'Choose a telemetry CSV first.' in workspace
          assert 'const ACLM_APP_VERSION="0.8.2";' in Path('src/payload/app/app.js').read_text()
          print('v0.8.2 telemetry analysis feedback gates passed')
          PY
      - name: Package, publish, and align manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,zipfile
          v=os.environ['APP_VERSION'];name=f'ACLM_Tire_Lab_Setup_v{v}.zip';archive=Path('/tmp')/name
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
           for p in sorted(Path('src').rglob('*')):
            if p.is_file(): z.write(p,p.relative_to('src').as_posix())
          sha=hashlib.sha256(archive.read_bytes()).hexdigest()
          pub=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          notes='Makes telemetry import and analysis visibly responsive, opens the results panel automatically, and keeps action feedback visible while logger status polling continues. No tire physics changed.'
          manifest={'product':'ACLM Historical Tire Lab','channel':'stable','version':v,'file_name':name,'release_page':f'https://github.com/aclmproject/tire_lab/releases/tag/v{v}','download_url':f'https://github.com/aclmproject/tire_lab/releases/download/v{v}/{name}','sha256':sha,'published_utc':pub,'notes':notes}
          Path('manifests/ACLM_Tire_Lab_latest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('/tmp/app_sha').write_text(sha)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/ACLM_Tire_Lab_latest.json
          git diff --cached --quiet || git commit -m "release: align v0.8.2 installer manifest"
          git push origin HEAD:main
          sha="$(cat /tmp/app_sha)"
          notes="Makes telemetry import and analysis visibly responsive, opens the results panel automatically, and keeps action feedback visible while logger status polling continues. No tire physics changed. SHA-256: $sha"
          if gh release view "v$APP_VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v$APP_VERSION" "/tmp/ACLM_Tire_Lab_Setup_v$APP_VERSION.zip" manifests/ACLM_Tire_Lab_latest.json docs/Telemetry_Analysis_Feedback_v082.md --clobber --repo "${{ github.repository }}"
            gh release edit "v$APP_VERSION" --draft=false --title "ACLM Historical Tire Lab v$APP_VERSION" --notes "$notes" --repo "${{ github.repository }}"
            gh release edit "v$APP_VERSION" --latest --repo "${{ github.repository }}"
          else
            gh release create "v$APP_VERSION" "/tmp/ACLM_Tire_Lab_Setup_v$APP_VERSION.zip" manifests/ACLM_Tire_Lab_latest.json docs/Telemetry_Analysis_Feedback_v082.md --target "$(git rev-parse HEAD)" --title "ACLM Historical Tire Lab v$APP_VERSION" --notes "$notes" --repo "${{ github.repository }}"
          fi
