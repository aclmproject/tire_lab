name: Release Tire Lab v0.6.3 Load Duty and LUT Integrity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v063-load-duty-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tire-lab-v063-load-duty-integrity
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 0.6.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Tire Lab v0.6.3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil

          version="0.6.3"
          previous="0.6.2"

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old,new,1)

          app_path=Path("src/payload/app/app.js")
          app=app_path.read_text(encoding="utf-8")
          app=replace_once(app,'const ACLM_APP_VERSION="0.6.2";','const ACLM_APP_VERSION="0.6.3";',"app version")
          app=replace_once(app,'build:"v0.6.1",','build:"v"+ACLM_APP_VERSION,',"PDF build version")
          app=replace_once(app,'; Generated by ACLM Historical Tire Lab v0.6.1','; Generated by ACLM Historical Tire Lab v${ACLM_APP_VERSION}',"generated INI version")
          app=replace_once(app,'files["ACLM_TIREPACK_MANIFEST.txt"]=`ACLM Historical Tire Lab v0.6.1','files["ACLM_TIREPACK_MANIFEST.txt"]=`ACLM Historical Tire Lab v${ACLM_APP_VERSION}',"generated manifest version")

          fz_anchor='''function fz0(axle){
           const m=n("mass"), fw=n("frontWeight")/100, factor=n("fzFactor");
           const raw=m*9.80665*(axle==="front"?fw:(1-fw))/2*factor;
           const ov=n(axle==="front"?"fzF":"fzR");
           return Math.round(ov>0?ov:raw);
          }
          '''
          load_duty='''function fz0(axle){
           const m=n("mass"), fw=n("frontWeight")/100, factor=n("fzFactor");
           const raw=m*9.80665*(axle==="front"?fw:(1-fw))/2*factor;
           const ov=n(axle==="front"?"fzF":"fzR");
           return Math.round(ov>0?ov:raw);
          }
          const LOAD_DUTY_PRIORS=Object.freeze({
           light:Object.freeze({label:"Light",cool:0.88,friction:1.08}),
           medium:Object.freeze({label:"Medium",cool:1.00,friction:1.00}),
           heavy:Object.freeze({label:"Heavy",cool:1.06,friction:0.96})
          });
          function loadDuty(axle){
           const widthMm=n(axle==="front"?"fw":"rw")*1000;
           const loadN=fz0(axle);
           const intensity=widthMm>0?loadN/widthMm:NaN;
           const key=Number.isFinite(intensity)?(intensity<9?"light":intensity<=13?"medium":"heavy"):"medium";
           return {axle,key,label:LOAD_DUTY_PRIORS[key].label,intensity,widthMm,loadN,...LOAD_DUTY_PRIORS[key]};
          }
          function applyLoadDutyThermal(base,axle){
           const duty=loadDuty(axle);
           return {...base,fric:clamp(Number(base.fric)*duty.friction,0.001,0.5),cool:clamp(Number(base.cool)*duty.cool,0.10,10),duty};
          }
          function loadDutySummary(){
           return ["front","rear"].map(axle=>{
            const d=loadDuty(axle);
            return (axle==="front"?"F":"R")+" "+d.label.toLowerCase()+" "+(Number.isFinite(d.intensity)?d.intensity.toFixed(2):"?")+" N/mm";
           }).join(" | ");
          }
          function refreshLoadDutyStatus(){
           const el=$("loadDutyStatus");if(!el)return;
           el.innerHTML="<b>Thermal load duty:</b> "+escapeHtml(loadDutySummary())+". Thresholds (&lt;9 light, 9-13 medium, &gt;13 heavy N/mm) are transparent simulation reconstruction priors; the tire-family knowledge values remain unchanged.";
          }
          '''
          app=replace_once(app,fz_anchor,load_duty,"load-duty functions")

          app=replace_once(app,
              ' const suffix=index===0?"":"_"+index, sec="THERMAL_"+(axle==="front"?"FRONT":"REAR")+suffix;',
              ' t=applyLoadDutyThermal(t,axle);\n const suffix=index===0?"":"_"+index, sec="THERMAL_"+(axle==="front"?"FRONT":"REAR")+suffix;',
              "thermal load-duty application")
          app=replace_once(app,
              ' return `[${sec}]',
              ' const dutyNote="; ACLM load-duty reconstruction: "+t.duty.key+"; "+t.duty.intensity.toFixed(2)+" N/mm; cooling x"+t.duty.cool.toFixed(3)+"; friction heat x"+t.duty.friction.toFixed(3);\n return dutyNote+"\\n"+`[${sec}]',
              "thermal load-duty provenance comment")

          manifest_anchor='''FZ0 front/rear: ${fz0("front")} / ${fz0("rear")} N
          AC tire format: VERSION=10'''
          manifest_new='''FZ0 front/rear: ${fz0("front")} / ${fz0("rear")} N
          Load-duty thermal reconstruction: ${loadDutySummary()}
          AC tire format: VERSION=10'''
          app=replace_once(app,manifest_anchor,manifest_new,"manifest load-duty provenance")

          report_line='''     {label:"Reference load FZ0",value:`${fz0("front")} N front / ${fz0("rear")} N rear`},'''
          report_new=report_line+'''\n     {label:"Thermal load duty",value:loadDutySummary()+"; transparent N/mm reconstruction thresholds"},'''
          app=replace_once(app,report_line,report_new,"PDF load-duty row")
          app=replace_once(app,
              '"Unmarked values are user selections, defaults or Tire Lab reconstruction/calibration values."',
              '"Unmarked values are user selections, defaults or Tire Lab reconstruction/calibration values.",\n    "Load-duty thermal scaling uses FZ0 per tread width for each axle. It is a transparent simulation reconstruction prior, not confidential supplier data."',
              "PDF load-duty provenance")
          app=replace_once(app,
              '"User-adjustable AC tire-wear multipliers can compress or extend race strategy without changing the historical baseline wear curve."',
              '"User-adjustable AC tire-wear multipliers can compress or extend race strategy without changing the historical baseline wear curve.",\n    "Light/medium/heavy thermal load-duty thresholds require telemetry validation for each car, track, setup and ambient condition."',
              "PDF load-duty limitation")

          gate='''function lutIntegrityErrors(name,text){
           const errors=[];
           if(typeof text!=="string")return [name+": LUT is not text."];
           if(text.includes("\\\\n"))errors.push(name+": contains literal \\\\n text instead of real line breaks.");
           if(text.includes("/n"))errors.push(name+": contains invalid /n text.");
           if(text.includes("\\\\r"))errors.push(name+": contains literal \\\\r text.");
           if(text.includes("\\r"))errors.push(name+": contains carriage-return characters; Tire Lab exports canonical LF rows.");
           const rows=text.split("\\n").filter(line=>line.trim()&&!line.trim().startsWith(";"));
           const xs=[];
           for(const line of rows){
            const parts=line.split("|");
            if(parts.length!==2||!parts[0].trim()||!parts[1].trim()||!Number.isFinite(Number(parts[0]))||!Number.isFinite(Number(parts[1]))){
             errors.push(name+': malformed/non-numeric LUT row "'+line+'".');
            }else xs.push(Number(parts[0]));
           }
           if(xs.length<2)errors.push(name+": LUT has fewer than two numeric points.");
           for(let i=1;i<xs.length;i++)if(xs[i]<=xs[i-1])errors.push(name+": X axis is not strictly increasing.");
           return errors;
          }
          function collectLutIntegrityErrors(files){
           const errors=[];
           Object.entries(files).filter(([name])=>name.toLowerCase().endsWith(".lut")).forEach(([name,text])=>errors.push(...lutIntegrityErrors(name,text)));
           return errors;
          }
          function assertLutIntegrity(files){
           const errors=collectLutIntegrityErrors(files);
           if(errors.length)throw new Error("LUT integrity gate blocked export: "+errors.join(" "));
          }

          '''
          app=replace_once(app,"function build(){",gate+"function build(){","global LUT integrity gate")
          app=replace_once(app,"function build(){\n const comps=selectedCompounds();","function build(){\n refreshLoadDutyStatus();\n const comps=selectedCompounds();","load-duty refresh on build")
          app=replace_once(app,
              ' if(!window.ACLMPdf || typeof window.ACLMPdf.create!=="function") throw new Error("Historical PDF report engine is unavailable.");',
              ' assertLutIntegrity(files);\n if(!window.ACLMPdf || typeof window.ACLMPdf.create!=="function") throw new Error("Historical PDF report engine is unavailable.");',
              "LUT gate before PDF and ZIP")

          marker_start=app.index(" // Generic LUT parse/monotonic check")
          marker_end=app.index(' if(!window.ACLMPressure)',marker_start)
          if marker_start<0 or marker_end<0:
              raise SystemExit("generic LUT validation block anchors not found")
          app=app[:marker_start]+' collectLutIntegrityErrors(files).forEach(error=>errors.push(error));\n'+app[marker_end:]
          app=replace_once(app,
              ' info.push(`Auto FZ0: ${fz0("front")} N front / ${fz0("rear")} N rear.`);',
              ' info.push(`Auto FZ0: ${fz0("front")} N front / ${fz0("rear")} N rear.`);\n info.push("Thermal load duty: "+loadDutySummary()+".");',
              "validation load-duty info")

          hook='''["mass","frontWeight","fzFactor","fw","rw","fzF","fzR"].forEach(id=>{
           const el=$(id);if(el)el.addEventListener("input",()=>{
            refreshLoadDutyStatus();
            try{generatedFiles=build();const vr=validate(generatedFiles);renderValidation(vr);renderFiles(generatedFiles);}catch(e){}
           });
          });
          refreshLoadDutyStatus();

          '''
          app=replace_once(app,'$("car").addEventListener("input",()=>{currentExportZipName="";updateOutputName();});',
              '$("car").addEventListener("input",()=>{currentExportZipName="";updateOutputName();});\n'+hook,
              "live load-duty refresh")
          app_path.write_text(app,encoding="utf-8",newline="")

          index_path=Path("src/payload/app/index.html")
          index=index_path.read_text(encoding="utf-8")
          index=replace_once(index,"v0.6.2 Browser App","v0.6.3 Browser App","index header")
          index=replace_once(index,'<b id="installedBuild">v0.6.1</b>','<b id="installedBuild">v0.6.3</b>',"installed-build label")
          geometry=''' <div><label>Rear FZ0 override (N, 0=auto)</label><input id="fzR" type="number" value="0"></div>
          </div>
          </div>'''
          geometry_new=''' <div><label>Rear FZ0 override (N, 0=auto)</label><input id="fzR" type="number" value="0"></div>
          </div>
          <div id="loadDutyStatus" class="notice small">Thermal load duty is calculated independently for each axle from FZ0 per tread width.</div>
          </div>'''
          index=replace_once(index,geometry,geometry_new,"load-duty UI status")
          index_path.write_text(index,encoding="utf-8",newline="")

          replacements=[
              ("src/payload/Server_ACLM_Tire_Lab.ps1",'$CurrentVersion = "0.6.2"','$CurrentVersion = "0.6.3"',"server version"),
              ("src/payload/Server_ACLM_Tire_Lab.ps1",'"User-Agent"="ACLM-Historical-Tire-Lab/0.6.1"','"User-Agent"="ACLM-Historical-Tire-Lab/$CurrentVersion"',"server user agent"),
              ("src/payload/app/sw.js","aclm-tire-lab-shell-v062-temperature-export","aclm-tire-lab-shell-v063-load-duty-integrity","service worker cache"),
              ("README.md","Current application release: **v0.6.2**","Current application release: **v0.6.3**","repository version"),
          ]
          for filename,old,new,label in replacements:
              path=Path(filename)
              text=path.read_text(encoding="utf-8")
              path.write_text(replace_once(text,old,new,label),encoding="utf-8",newline="")

          for filename in [
              "src/payload/Launch_ACLM_Tire_Lab.cmd",
              "src/Install_ACLM_Tire_Lab.cmd",
              "src/README_FIRST.txt",
          ]:
              path=Path(filename)
              text=path.read_text(encoding="utf-8")
              if previous not in text:
                  raise SystemExit(f"{filename}: previous version not found")
              path.write_text(text.replace(previous,version),encoding="utf-8",newline="")

          knowledge_source=Path("knowledge/releases/ACLM_Tire_Knowledge_v1.6.0.json")
          knowledge_target=Path("src/payload/app/knowledge_fallback.json")
          shutil.copyfile(knowledge_source,knowledge_target)
          release=json.loads(knowledge_source.read_text(encoding="utf-8"))
          compact=json.dumps(release,separators=(",",":"),ensure_ascii=False)
          wrapper="(()=>{const r="+compact+";if(window.ACLMHistoricalCategories?.loadKnowledgeRelease)window.ACLMHistoricalCategories.loadKnowledgeRelease(r,'bundled fallback');})();\n"
          Path("src/payload/app/knowledge_fallback.js").write_text(wrapper,encoding="utf-8",newline="")

          changelog_path=Path("src/payload/Documentation/CHANGELOG.txt")
          changelog=changelog_path.read_text(encoding="utf-8-sig")
          heading="ACLM HISTORICAL TIRE LAB - CHANGELOG\n====================================\n\n"
          if not changelog.startswith(heading):
              raise SystemExit("Unexpected changelog heading")
          entry=f"""2026-08-25 - v{version}
          - Adds per-axle light/medium/heavy thermal load-duty reconstruction from FZ0 per tread width; tire-family priors remain immutable.
          - Light duty uses cooling x0.88 and friction heat x1.08, medium x1.00/x1.00, heavy x1.06/x0.96; thresholds and provenance appear in the UI, manifest, INI comments and PDF.
          - Adds a global LUT integrity gate for literal \\n, /n, literal \\r, carriage returns, malformed/non-numeric rows and non-increasing X axes.
          - Removes stale v0.6.1 strings from generated headers, manifests, reports, installed-build UI and update user-agent.
          - Bundles validated Tire Knowledge v1.6.0 (73 families/classes, 145 sources, 184 measurements).
          - Retains both AC import paths, historical menus, graphs, pressure solver, terminal failure, PDF report, reliable updates and one canonical launcher.

          """
          changelog_path.write_text(heading+entry+changelog[len(heading):],encoding="utf-8",newline="")
          PY

      - name: Validate v0.6.3 across every knowledge family and compound slot
        shell: bash
        run: |
          set -euo pipefail
          node --check src/payload/app/app.js
          node --check src/payload/app/sw.js
          node --check src/payload/app/knowledge_fallback.js
          pwsh -NoLogo -NoProfile -Command '& { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("src/payload/Server_ACLM_Tire_Lab.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if($errors.Count){$errors | ForEach-Object { Write-Error $_ }; exit 1} }'

          node <<'NODE'
          const fs=require("fs"),vm=require("vm"),assert=require("assert");
          const app=fs.readFileSync("src/payload/app/app.js","utf8");
          const values={mass:950,frontWeight:50,fzFactor:1,fw:.215,rw:.245,fzF:1749,fzR:2006};
          const context=vm.createContext({
            n:id=>Number(values[id]||0),
            clamp:(x,a,b)=>Math.max(a,Math.min(b,x)),
            $:()=>null,
            escapeHtml:x=>String(x)
          });
          const dutyStart=app.indexOf("function fz0(axle)");
          const dutyEnd=app.indexOf("function tireSection(",dutyStart);
          assert(dutyStart>=0&&dutyEnd>dutyStart,"load-duty block anchors");
          vm.runInContext(app.slice(dutyStart,dutyEnd),context);
          let front=vm.runInContext('loadDuty("front")',context);
          let rear=vm.runInContext('loadDuty("rear")',context);
          assert.equal(front.key,"light");assert.equal(rear.key,"light");
          const escort=vm.runInContext('applyLoadDutyThermal({fric:.03825,cool:1.825},"front")',context);
          assert(Math.abs(escort.fric-.04131)<.00001);
          assert(Math.abs(escort.cool-1.606)<.001);
          values.fzF=2200;values.fw=.2;
          assert.equal(vm.runInContext('loadDuty("front").key',context),"medium");
          values.fzF=4000;
          assert.equal(vm.runInContext('loadDuty("front").key',context),"heavy");

          const gateStart=app.indexOf("function lutIntegrityErrors(");
          const gateEnd=app.indexOf("function build(){",gateStart);
          assert(gateStart>=0&&gateEnd>gateStart,"LUT gate anchors");
          vm.runInContext(app.slice(gateStart,gateEnd),context);
          const check=text=>vm.runInContext("lutIntegrityErrors('test.lut',"+JSON.stringify(text)+")",context);
          assert.deepEqual(Array.from(check("0|1\n1|.9\n")),[]);
          assert(check("0|1\\n1|.9").some(x=>x.includes("literal")));
          assert(check("0|1/n1|.9").some(x=>x.includes("/n")));
          assert(check("0|1\\r1|.9").some(x=>x.includes("literal")));
          assert(check("0|1\r\n1|.9\r\n").some(x=>x.includes("carriage-return")));
          assert(check("0|1\nbad|.9\n").some(x=>x.includes("non-numeric")));
          assert(check("1|1\n1|.9\n").some(x=>x.includes("strictly increasing")));
          console.log("Runtime load-duty and LUT-gate tests passed");
          NODE

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, math, re

          app=Path("src/payload/app/app.js").read_text(encoding="utf-8")
          index=Path("src/payload/app/index.html").read_text(encoding="utf-8")
          server=Path("src/payload/Server_ACLM_Tire_Lab.ps1").read_text(encoding="utf-8")
          launcher=Path("src/payload/Launch_ACLM_Tire_Lab.cmd").read_text(encoding="utf-8")
          installer=Path("src/Install_ACLM_Tire_Lab.cmd").read_text(encoding="utf-8")
          readme_first=Path("src/README_FIRST.txt").read_text(encoding="utf-8")
          sw=Path("src/payload/app/sw.js").read_text(encoding="utf-8")
          changelog=Path("src/payload/Documentation/CHANGELOG.txt").read_text(encoding="utf-8")
          fallback_raw=Path("src/payload/app/knowledge_fallback.json").read_bytes()
          fallback=json.loads(fallback_raw.decode("utf-8"))
          release_raw=Path("knowledge/releases/ACLM_Tire_Knowledge_v1.6.0.json").read_bytes()
          knowledge=json.loads(release_raw.decode("utf-8"))

          assert fallback_raw==release_raw
          assert hashlib.sha256(fallback_raw).hexdigest()=="8cf98a99947e2d8f9031f9310d2fbe35f6acd4aec2c131a10c8887375e6d4c1d"
          assert fallback["releaseVersion"]=="1.6.0" and fallback["schemaVersion"]=="1.2.0"
          assert len(fallback["families"])==73 and len(fallback["classes"])==73
          assert len(fallback["sources"])==145 and len(fallback["measurements"])==184
          assert len(fallback["generatorPriors"])==73

          assert 'const ACLM_APP_VERSION="0.6.3";' in app
          assert 'build:"v"+ACLM_APP_VERSION' in app
          assert "Generated by ACLM Historical Tire Lab v${ACLM_APP_VERSION}" in app
          assert 'ACLM Historical Tire Lab v${ACLM_APP_VERSION}' in app
          assert "v0.6.1" not in app and "v0.6.2" not in app
          assert "v0.6.3 Browser App" in index
          assert '<b id="installedBuild">v0.6.3</b>' in index
          assert 'id="loadDutyStatus"' in index
          assert '$CurrentVersion = "0.6.3"' in server
          assert '"User-Agent"="ACLM-Historical-Tire-Lab/$CurrentVersion"' in server
          assert "EXPECTED_VERSION=0.6.3" in launcher and "?build=0.6.3" in launcher
          assert "0.6.3" in installer and "0.6.3" in readme_first
          assert "aclm-tire-lab-shell-v063-load-duty-integrity" in sw
          assert changelog.startswith("ACLM HISTORICAL TIRE LAB - CHANGELOG\n====================================\n\n2026-08-25 - v0.6.3")

          assert "const LOAD_DUTY_PRIORS" in app
          assert 'light:Object.freeze({label:"Light",cool:0.88,friction:1.08})' in app
          assert 'heavy:Object.freeze({label:"Heavy",cool:1.06,friction:0.96})' in app
          assert "t=applyLoadDutyThermal(t,axle);" in app
          assert "LUT integrity gate blocked export" in app
          for marker in ['text.includes("\\\\n")','text.includes("/n")','text.includes("\\\\r")','X axis is not strictly increasing','malformed/non-numeric LUT row']:
              assert marker in app, marker
          assert "assertLutIntegrity(files);" in app
          assert app.index("assertLutIntegrity(files);") < app.index("window.ACLMPdf.create(buildHistoricalReportData(comps))")

          # Preserve every major v0.6.2 behavior surface.
          for marker in [
              "async function doZipImport()", "async function doFolderImport()",
              "function updateHistoricalCompoundLabels()", "function renderTireGraphs()",
              "function refreshSolvedPressures()", "terminalFailure",
              "window.ACLMPdf.create", "async function checkForUpdates(",
              "async function loadCurrentKnowledge(", "async function syncKnowledge("
          ]:
              assert marker in app, marker
          assert "importZip" in app and "importFolder" in app
          assert installer.count("CreateShortcut")==1
          assert "ACLM Historical Tire Lab (1).lnk" in installer
          assert r"Startup\ACLM Tire Lab Server.lnk" in installer
          assert r"Chrome Apps\ACLM Historical Tire Lab.lnk" in installer

          mapping={"soft":"soft","qualifying":"soft","race":"medium","control":"medium","dry":"medium","hard":"hard","endurance":"hard","intermediate":"intermediate","wet":"wet","wet_hard":"wet"}
          family_ids={f["id"] for f in knowledge["families"]}
          prior_ids=set(knowledge["generatorPriors"])
          assert family_ids==prior_ids
          required_numeric=[
              "surfaceTransfer","patchTransfer","coreTransfer","internalCoreTransfer",
              "frictionK","rollingK","cool","tempOpt","tempWidth","gripLat","gripLong",
              "loadX","loadY","relax","ratePerWidth"
          ]
          exercised=set()
          for cls in knowledge["classes"]:
              assert cls["familyId"] in family_ids
              assert cls.get("menu")
              for item in cls["menu"]:
                  assert item["kind"] in mapping,(cls["id"],item["kind"])
                  slot=mapping[item["kind"]]
                  exercised.add((cls["familyId"],slot))
                  assert float(item["lifeKm"])>0
          assert exercised

          duty_factors={"light":(.88,1.08),"medium":(1,1),"heavy":(1.06,.96)}
          for family_id,prior in knowledge["generatorPriors"].items():
              for key in required_numeric:
                  value=float(prior[key])
                  assert math.isfinite(value),(family_id,key)
              for duty,(cool_factor,fric_factor) in duty_factors.items():
                  cool=float(prior["cool"])*cool_factor
                  fric=float(prior["frictionK"])*fric_factor
                  assert .1<=cool<=10 and .001<=fric<=.5,(family_id,duty)
              center=float(prior["tempOpt"]); width=max(8,float(prior["tempWidth"]))
              for slot,offset in (("soft",-4),("medium",0),("hard",4)):
                  c=center+offset
                  points=[
                      (max(0,c-2.6*width),.66),(max(0,c-1.8*width),.78),
                      (max(0,c-1.15*width),.90),(max(0,c-.55*width),.98),
                      (max(0,c-.22*width),1.00),(c+.22*width,1.00),
                      (c+.65*width,.97),(c+1.25*width,.89),(c+2.0*width,.74),(c+2.8*width,.55)
                  ]
                  xs=[]
                  for x,_ in points:
                      x=round(x)
                      if not xs or x>xs[-1]: xs.append(x)
                  assert len(xs)>=2 and all(b>a for a,b in zip(xs,xs[1:])),(family_id,slot)
          assert any(slot=="soft" for _,slot in exercised)
          assert any(slot=="medium" for _,slot in exercised)
          assert any(slot=="hard" for _,slot in exercised)
          assert any(slot=="intermediate" for _,slot in exercised)
          assert any(slot=="wet" for _,slot in exercised)
          print(f"Validated 73 families/classes and {len(exercised)} family/compound-slot combinations")
          PY

      - name: Package app and update stable manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, os, zipfile

          version=os.environ["APP_VERSION"]
          src=Path("src")
          archive_name=f"ACLM_Tire_Lab_Setup_v{version}.zip"
          archive=Path("/tmp")/archive_name
          with zipfile.ZipFile(archive,"w",zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(src.rglob("*")):
                  if path.is_file():
                      zf.write(path,path.relative_to(src).as_posix())
          archive_sha=hashlib.sha256(archive.read_bytes()).hexdigest()
          published=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          manifest={
              "product":"ACLM Historical Tire Lab",
              "channel":"stable",
              "version":version,
              "file_name":archive_name,
              "release_page":f"https://github.com/aclmproject/tire_lab/releases/tag/v{version}",
              "download_url":f"https://github.com/aclmproject/tire_lab/releases/download/v{version}/{archive_name}",
              "sha256":archive_sha,
              "published_utc":published,
              "notes":"Per-axle FZ0/width thermal duty, strict LUT integrity gate, bundled Knowledge v1.6.0, and one canonical launcher."
          }
          manifest_path=Path("manifests/ACLM_Tire_Lab_latest.json")
          manifest_path.write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          Path("/tmp/app_release_sha256").write_text(archive_sha,encoding="ascii")
          print(json.dumps({"version":version,"sha256":archive_sha,"archive":str(archive)},indent=2))
          PY

      - name: Commit v0.6.3 source and stable manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src manifests/ACLM_Tire_Lab_latest.json
          git commit -m "feat: release Tire Lab v0.6.3 load-duty thermal calibration"
          git push origin HEAD:main

      - name: Publish the single Tire Lab v0.6.3 installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$APP_VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v$APP_VERSION already exists"
            exit 1
          fi
          sha="$(cat /tmp/app_release_sha256)"
          gh release create "v$APP_VERSION" "/tmp/ACLM_Tire_Lab_Setup_v$APP_VERSION.zip" "manifests/ACLM_Tire_Lab_latest.json" \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "ACLM Historical Tire Lab v$APP_VERSION" \
            --notes "Per-car thermal duty and export-integrity release.
          - calculates independent front/rear light, medium or heavy thermal duty from FZ0 per tread width
          - keeps immutable tire-family priors, then applies transparent cooling/friction reconstruction factors per axle
          - blocks literal \\n, /n, literal \\r, carriage returns, malformed/non-numeric LUT rows and non-increasing X axes
          - bundles validated Tire Knowledge v1.6.0 with 73 families/classes, 145 sources and 184 measurements
          - removes stale generator/report/update version strings
          - preserves both import paths, historical menus, graphs, pressure solver, terminal failure, PDF reporting, reliable updates and one canonical launcher
          SHA-256: $sha"
          gh release edit "v$APP_VERSION" --repo "${{ github.repository }}" --latest
