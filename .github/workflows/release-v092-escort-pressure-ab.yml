name: Release Tire Lab v0.9.2 Escort Pressure A-B
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v092-escort-pressure-ab.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  APP_VERSION: 0.9.2
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pressure closure, telemetry, and non-retuning regression suite
        shell: bash
        run: |
          set -euo pipefail
          for file in src/payload/app/*.js; do node --check "$file"; done
          node --check tests/telemetry_ui_fixture_server.mjs
          node --test tests/thermal_v2.test.js
          node tests/telemetry_calibration.test.js
          logger_result="$(pwsh -NoLogo -NoProfile -File src/payload/Telemetry/ACLM_Native_Telemetry_Logger.ps1 -SelfTest)"
          echo "$logger_result"
          grep -q 'ACLM native telemetry 1.1' <<<"$logger_result"
          pwsh -NoLogo -NoProfile -Command '& { $t=$null;$e=$null;[Management.Automation.Language.Parser]::ParseFile("src/payload/Server_ACLM_Tire_Lab.ps1",[ref]$t,[ref]$e)|Out-Null;if($e.Count){$e|ForEach-Object{Write-Error $_};exit 1} }'
          git diff --exit-code HEAD^ HEAD -- src/payload/app/thermal_v2.js src/payload/app/knowledge_fallback.json src/payload/app/historical_categories.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          app=Path('src/payload/app/app.js').read_text()
          html=Path('src/payload/app/index.html').read_text()
          core=Path('src/payload/app/validation_core.js').read_text()
          fixture=json.loads(Path('tests/fixtures/telemetry/escort_rs1600_brands_hatch_pressure_ab_v092.json').read_text())
          assert 'const ACLM_APP_VERSION="0.9.2";' in app
          assert '<b id="installedBuild">v0.9.2</b>' in html
          assert 'ACLM_PRESSURE_CLOSURE_REPORT.json' in app
          assert 'pressureABRole' in html and 'pressureABTireId' in html and 'pressureUnsafeBaseline' in html
          assert 'PRESSURE_COMPLIANCE_KEYS' in core and 'comparePressureAB' in core
          assert fixture['baseline']['approximateHotPressureErrorPsi']=={'fl':-2,'fr':-3,'rl':-2,'rr':-3}
          assert fixture['baseline']['safetyFlag']=='GENERATED BASELINE UNSAFE FOR CONTINUED HIGH-SPEED VALIDATION'
          assert fixture['correctedTest']['coldPressureAdjustmentPsi']=={'fl':2,'fr':3,'rl':2,'rr':3}
          assert all(v=='hold' for v in fixture['decisions'].values())
          print('v0.9.2 Escort pressure/compliance gates passed; generator coefficients remain frozen')
          PY
      - name: Package, publish, and align manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,zipfile
          v=os.environ['APP_VERSION'];name=f'ACLM_Tire_Lab_Setup_v{v}.zip';archive=Path('/tmp')/name
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
           for p in sorted(Path('src').rglob('*')):
            if p.is_file(): z.write(p,p.relative_to('src').as_posix())
          sha=hashlib.sha256(archive.read_bytes()).hexdigest()
          pub=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          notes='Adds the Escort Brands Hatch pressure/compliance calibration gate, per-wheel hot-pressure closure, same-tire cold-pressure A/B workflow, unsafe-baseline stop flag and per-pack pressure prediction report. The generator and historical family coefficients are unchanged pending corrected Escort telemetry.'
          manifest={'product':'ACLM Historical Tire Lab','channel':'stable','version':v,'file_name':name,'release_page':f'https://github.com/aclmproject/tire_lab/releases/tag/v{v}','download_url':f'https://github.com/aclmproject/tire_lab/releases/download/v{v}/{name}','sha256':sha,'published_utc':pub,'notes':notes}
          Path('manifests/ACLM_Tire_Lab_latest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('/tmp/app_sha').write_text(sha)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/ACLM_Tire_Lab_latest.json
          git diff --cached --quiet || git commit -m "release: align v0.9.2 installer manifest"
          git push origin HEAD:main
          sha="$(cat /tmp/app_sha)"
          notes="Escort pressure/compliance diagnostic release. The Brands Hatch baseline is recorded as approximately -2 psi left / -3 psi right and FAIL, with a safety stop for severe rollover/tripping. The next run uses the identical tire with temporary +2 psi left / +3 psi right cold corrections. No generator, family, thermal, grip, wear or compliance coefficients changed. SHA-256: $sha"
          assets=("/tmp/ACLM_Tire_Lab_Setup_v$APP_VERSION.zip" manifests/ACLM_Tire_Lab_latest.json docs/Escort_RS1600_Pressure_Compliance_AB_v092.md tests/fixtures/telemetry/escort_rs1600_brands_hatch_pressure_ab_v092.json)
          if gh release view "v$APP_VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v$APP_VERSION" "${assets[@]}" --clobber --repo "${{ github.repository }}"
            gh release edit "v$APP_VERSION" --draft=false --title "ACLM Historical Tire Lab v$APP_VERSION" --notes "$notes" --repo "${{ github.repository }}"
            gh release edit "v$APP_VERSION" --latest --repo "${{ github.repository }}"
          else
            gh release create "v$APP_VERSION" "${assets[@]}" --target "$(git rev-parse HEAD)" --title "ACLM Historical Tire Lab v$APP_VERSION" --notes "$notes" --repo "${{ github.repository }}"
          fi
