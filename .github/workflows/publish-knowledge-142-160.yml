name: Publish Tire Knowledge 1.4.2 through 1.6.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-knowledge-142-160.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-knowledge-142-160
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate immutable knowledge lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root=Path("knowledge/releases")
          specs={
              "1.4.2":{"file":"ACLM_Tire_Knowledge_v1.4.2.json","sha256":"a97b761fe6730a9422b214b90a72098aa0767f6e8c299b14b846bd5f7f335222","families":37,"classes":37,"sources":110,"measurements":149,"content":"8583a2a672966cf4256b8b65433645f97836402235264105c55d6393246a77d9"},
              "1.5.0":{"file":"ACLM_Tire_Knowledge_v1.5.0.json","sha256":"e9cf8731a6ee9f438714b20cd35cdc87e3d2753e9bf4f883ec22c4c56114595c","families":60,"classes":60,"sources":134,"measurements":171,"content":"f831d519e9461840f4c72f0bceaa6d7c99f146fc6ceb9fb2cd3772d0c5b1a3b1"},
              "1.6.0":{"file":"ACLM_Tire_Knowledge_v1.6.0.json","sha256":"8cf98a99947e2d8f9031f9310d2fbe35f6acd4aec2c131a10c8887375e6d4c1d","families":73,"classes":73,"sources":145,"measurements":184,"content":"e2cb456dfe1f959bc590c4bd4529b32c185558bd8fc5a25cb68fb6bee190ea58"},
          }
          validation=json.loads((root/"ACLM_Tire_Knowledge_1.5_1.6_validation.json").read_text(encoding="utf-8"))

          def unique_ids(items,label):
              ids=[x.get("id") for x in items]
              if None in ids or len(ids)!=len(set(ids)):
                  raise SystemExit(f"{label}: missing or duplicate IDs")
              return set(ids)

          def refs(value,path="$"):
              found=[]
              if isinstance(value,list):
                  for i,item in enumerate(value): found.extend(refs(item,f"{path}[{i}]"))
              elif isinstance(value,dict):
                  for key,item in value.items():
                      child=f"{path}.{key}"
                      if key=="sourceId" and isinstance(item,str): found.append((child,item))
                      if key=="sourceIds" and isinstance(item,list):
                          found.extend((f"{child}[{i}]",source_id) for i,source_id in enumerate(item))
                      found.extend(refs(item,child))
              return found

          releases={}
          for version,spec in specs.items():
              path=root/spec["file"]
              raw=path.read_bytes()
              raw_sha=hashlib.sha256(raw).hexdigest()
              if raw_sha!=spec["sha256"]: raise SystemExit(f"{version}: raw SHA-256 mismatch")
              data=json.loads(raw.decode("utf-8"))
              if data.get("releaseVersion")!=version or data.get("schemaVersion")!="1.2.0":
                  raise SystemExit(f"{version}: release/schema mismatch")
              if len(data["families"])!=spec["families"] or len(data["classes"])!=spec["classes"] or len(data["sources"])!=spec["sources"] or len(data["measurements"])!=spec["measurements"]:
                  raise SystemExit(f"{version}: release counts mismatch")
              content_view={key:value for key,value in data.items() if key!="contentSha256"}
              canonical=json.dumps(content_view,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode("utf-8")
              content_sha=hashlib.sha256(canonical).hexdigest()
              if content_sha!=spec["content"] or data.get("contentSha256")!=content_sha:
                  raise SystemExit(f"{version}: deterministic content hash mismatch")
              fam_ids=unique_ids(data["families"],f"{version} families")
              class_ids=unique_ids(data["classes"],f"{version} classes")
              unique_ids(data["measurements"],f"{version} measurements")
              source_ids=set(data["sources"])
              prior_ids=set(data["generatorPriors"])
              if prior_ids!=fam_ids: raise SystemExit(f"{version}: generator-prior coverage mismatch")
              for family_id,prior in data["generatorPriors"].items():
                  if prior.get("familyId")!=family_id: raise SystemExit(f"{version}: prior key mismatch {family_id}")
              for cls in data["classes"]:
                  if cls.get("familyId") not in fam_ids: raise SystemExit(f"{version}: class {cls.get('id')} has no family")
                  if not isinstance(cls.get("menu"),list) or not cls["menu"]: raise SystemExit(f"{version}: class {cls.get('id')} has no compound menu")
              unresolved=[(path,source_id) for path,source_id in refs(data) if source_id not in source_ids]
              if unresolved: raise SystemExit(f"{version}: unresolved source reference {unresolved[0]}")
              expected=validation[version]
              if expected["sha256"]!=raw_sha: raise SystemExit(f"{version}: validation SHA mismatch")
              for key in ("families","classes","sources","measurements"):
                  actual=len(data[key])
                  if expected[key]!=actual: raise SystemExit(f"{version}: validation count mismatch {key}")
              if expected.get("contentSha256") and expected["contentSha256"]!=content_sha:
                  raise SystemExit(f"{version}: validation content hash mismatch")
              releases[version]=data

          def by_id(items): return {item["id"]:item for item in items}
          for older,newer in (("1.4.2","1.5.0"),("1.5.0","1.6.0")):
              old,new=releases[older],releases[newer]
              for key in ("families","classes","measurements"):
                  old_map,new_map=by_id(old[key]),by_id(new[key])
                  if any(identifier not in new_map or new_map[identifier]!=value for identifier,value in old_map.items()):
                      raise SystemExit(f"{older}->{newer}: non-additive {key} change")
              for key in ("sources","generatorPriors"):
                  if any(identifier not in new[key] or new[key][identifier]!=value for identifier,value in old[key].items()):
                      raise SystemExit(f"{older}->{newer}: non-additive {key} change")

          print("Knowledge 1.4.2 -> 1.5.0 -> 1.6.0 lineage validated")
          PY

      - name: Publish immutable knowledge releases in order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          publish_release() {
            version="$1"
            filename="ACLM_Tire_Knowledge_v$version.json"
            file="knowledge/releases/$filename"
            target="$(git log -1 --format=%H -- "$file")"
            if gh release view "knowledge-v$version" --repo "$REPOSITORY" >/dev/null 2>&1; then
              echo "knowledge-v$version already exists; leaving immutable release unchanged"
              return
            fi
            case "$version" in
              1.4.2) notes="Verified bridge release: 37 families/classes, 110 sources and 149 measurements. Schema 1.2.0." ;;
              1.5.0) notes="Formula chronology expansion: 60 families/classes, 134 sources and 171 measurements, with evidence-backed series compound menus." ;;
              1.6.0) notes="Modern Endurance expansion: 73 families/classes, 145 sources and 184 measurements; adds Hypercar/GTP/LMP2/GTE/LMGT3/GTD, surface-specific modern WRC, and NASCAR Next Gen." ;;
            esac
            gh release create "knowledge-v$version" "$file"               --repo "$REPOSITORY"               --target "$target"               --title "ACLM Tire Knowledge v$version"               --notes "$notes Numerical values without direct documentation remain reconstruction priors under the project evidence policy."               --latest=false
          }
          publish_release "1.4.2"
          publish_release "1.5.0"
          publish_release "1.6.0"

      - name: Promote the verified v1.6.0 pointer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          release_path=Path("knowledge/releases/ACLM_Tire_Knowledge_v1.6.0.json")
          release=json.loads(release_path.read_text(encoding="utf-8"))
          validation=json.loads(Path("knowledge/releases/ACLM_Tire_Knowledge_1.5_1.6_validation.json").read_text(encoding="utf-8"))
          published=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          pointer={
              "product":"ACLM Tire Knowledge",
              "channel":"stable",
              "schema_version":release["schemaVersion"],
              "version":release["releaseVersion"],
              "file_name":"ACLM_Tire_Knowledge_v1.6.0.json",
              "release_page":"https://github.com/aclmproject/tire_lab/releases/tag/knowledge-v1.6.0",
              "download_url":"https://github.com/aclmproject/tire_lab/releases/download/knowledge-v1.6.0/ACLM_Tire_Knowledge_v1.6.0.json",
              "sha256":validation["1.6.0"]["sha256"],
              "release_content_sha256":release["contentSha256"],
              "published_utc":published,
              "notes":"Validated Formula and Modern Endurance expansion through 73 families/classes, with source-backed series menus and reconstruction-prior guardrails."
          }
          Path("knowledge/ACLM_Tire_Knowledge_latest.json").write_text(json.dumps(pointer,indent=2)+chr(10),encoding="utf-8")
          readme_path=Path("README.md")
          readme=readme_path.read_text(encoding="utf-8")
          old="Current knowledge release: **v1.4.0** (schema 1.0.0)"
          new="Current knowledge release: **v1.6.0** (schema 1.2.0)"
          if old not in readme: raise SystemExit("README knowledge version anchor not found")
          readme_path.write_text(readme.replace(old,new,1),encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/ACLM_Tire_Knowledge_latest.json README.md
          if git diff --cached --quiet; then
            echo "Knowledge pointer already current"
          else
            git commit -m "docs: promote verified Tire Knowledge v1.6.0"
            git push origin HEAD:main
          fi
