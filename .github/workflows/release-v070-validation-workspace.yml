          <details><summary>Telemetry CSV overlay</summary><input id="telemetryCsv" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values"><div id="telemetryStatus" class="notice small">No telemetry loaded. Common tire temperature, speed, time, lap and distance headers are detected automatically.</div><canvas id="telemetryOverlay" width="680" height="230"></canvas></details>
          <details><summary>Pressure and camber recommendation sweep</summary><div class="grid3"><div><label>Compound slot</label><select id="sweepCompound"><option value="soft">Sprint/soft</option><option value="medium" selected>Race/medium</option><option value="hard">Endurance/hard</option><option value="intermediate">Intermediate</option><option value="wet">Wet</option></select></div><div><label>Axle</label><select id="sweepAxle"><option value="front">Front</option><option value="rear">Rear</option></select></div><div><label>Validation camber F (deg)</label><input id="validationCamberF" type="number" step=".1" value="-2.0"></div><div><label>Validation camber R (deg)</label><input id="validationCamberR" type="number" step=".1" value="-1.5"></div></div><div class="actions" style="margin-top:8px"><button id="runSweep">Run pressure/camber sweep</button></div><div id="sweepResults" class="workspace-results small"></div></details>
