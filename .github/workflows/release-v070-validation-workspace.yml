           function workspaceSnapshot(){return {product:"ACLM Tire Lab Validation Workspace",schemaVersion:"1.0.0",generatedUtc:new Date().toISOString(),car:v("car"),series:v("series"),track:state.track,telemetry:state.telemetry?{rows:state.telemetry.rows,mappingConfidence:state.telemetry.mappingConfidence,averageTemperature:state.telemetry.averageTemperature}:null,simulation:state.simulation,balance:state.balance,sweep:state.sweep,strategy:state.strategy,testProfile:state.testProfile,researchDraftCount:state.research.length,limitations:["screening simulation only","track KN5 geometry is not decoded","telemetry is authoritative only when channel mapping and sensor units are verified"]};}
