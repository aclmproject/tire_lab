           function renderEvidence(){const rows=[["Car identity",v("car")||"unresolved",provenanceLabel("car"),provenanceLabel("car")==="Direct AC package"?"high":"review"],["Series/class",v("series")||"unresolved",activeHistoricalContext?"knowledge class/family":"manual/unresolved",activeHistoricalContext?"medium":"low"],["Tire supplier",v("supplier")||"unresolved",provenanceLabel("supplier"),/unknown/i.test(v("supplier"))?"low":"review"],["Generator prior",activeHistoricalContext?.familyId||"none",activeFamilyPrior()?"reconstruction prior":"default",activeFamilyPrior()?"medium":"low"],["Track identity",state.track?.name||"not imported",state.track?"track ZIP metadata":"manual",state.track?"high":"low"],["Track energy",currentTrack().energyScore.toFixed(2),state.track?"derived from track files":"manual",state.track?"medium":"low"],["Telemetry",state.telemetry?state.telemetry.rows+" rows":"not imported",state.telemetry?"user CSV":"none",state.telemetry?.mappingConfidence||"low"]];e("evidenceResults").innerHTML=table(["Item","Value","Provenance","Confidence"],rows);}
           function populateTests(){const sel=e("testProfile");core.TEST_CARS.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=p.name+" ("+p.year+")";sel.appendChild(o);});}
           function applyTest(){const p=core.TEST_CARS.find(x=>x.id===e("testProfile").value);if(!p)return;state.testProfile=p;const set=(id,val)=>{if(e(id))e(id).value=val;};set("car",p.name);set("year",p.year);set("mass",p.mass);set("frontWeight",p.frontWeight);set("fzFactor",p.fzFactor);set("fw",p.fw);set("rw",p.rw);set("construction",p.construction);const cls=runtimeClasses().find(c=>p.seriesKeywords.some(k=>c.name.toLowerCase().includes(k)));if(cls){setMenuValue("series",cls.name);const ctx=window.ACLMHistoricalCategories?.contextForClass?.(cls.id,p.year);if(ctx){e("preset").value=ctx.familyId;applyHistoricalContext(ctx,"validation test profile");}}else setMenuValue("series",GENERAL_UNKNOWN);refreshLoadDutyStatus();refreshSolvedPressures();renderTireGraphs();renderEvidence();e("testExpected").innerHTML="<b>Expected behavior:</b> "+esc(p.expected)+"<br><b>Current static duty:</b> "+esc(loadDutySummary())+".";}
           function loadResearch(){try{state.research=JSON.parse(localStorage.getItem("aclm-research-review-v1")||"[]");if(!Array.isArray(state.research))state.research=[];}catch(err){state.research=[];}renderResearch();}
           function saveResearch(){try{localStorage.setItem("aclm-research-review-v1",JSON.stringify(state.research));}catch(err){}renderResearch();}
           function addResearch(){const entry={id:"EV-"+Date.now(),car:v("car"),year:v("year"),series:v("series"),supplier:v("supplier"),sourceUrl:e("researchUrl").value.trim(),summary:e("researchSummary").value.trim(),publicEvidence:e("researchPublic").checked,status:"draft",createdUtc:new Date().toISOString(),history:[{utc:new Date().toISOString(),action:"draft created",actor:"local user"}]};if(!entry.sourceUrl||!entry.summary){e("researchPacketStatus").innerHTML="<span class=\"error\">Source URL and evidence summary are required.</span>";return;}state.research.push(entry);saveResearch();e("researchPacketStatus").innerHTML="<span class=\"ok\">Draft evidence added locally.</span>";}
           function advanceResearch(id){const x=state.research.find(r=>r.id===id);if(!x)return;const next=x.status==="draft"?"reviewed-locally":"ready-for-maintainer-review";x.status=next;x.history.push({utc:new Date().toISOString(),action:next,actor:"local user"});saveResearch();}
