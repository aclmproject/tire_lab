          <details open><summary>Evidence and coefficient confidence</summary><div id="evidenceResults" class="workspace-results small"></div></details>
          <details open><summary>Repeatable car/track validation library</summary><div class="grid"><div><label>Test car</label><select id="testProfile"></select></div><div class="actions" style="align-items:end"><button id="applyTestProfile">Apply validation profile</button></div></div><div id="testExpected" class="notice small">Choose a reference car to populate mass, weight distribution, tire widths, construction and historical class when available.</div></details>
          <details><summary>Community research submission + review history</summary><div class="grid"><div><label>Public source URL</label><input id="researchUrl" type="url" placeholder="https://..."></div><div><label>Evidence summary</label><input id="researchSummary" placeholder="What the source establishes"></div></div><label class="check-inline"><input id="researchPublic" type="checkbox" checked> I confirm this is publicly citeable evidence and not confidential information.</label><div class="actions"><button id="addResearchDraft">Add local draft</button><button id="advanceResearch">Advance latest review status</button><button id="exportResearchPackets">Export review packets</button></div><div id="researchPacketStatus" class="small muted"></div><div id="researchReviewResults" class="workspace-results small"></div></details>
