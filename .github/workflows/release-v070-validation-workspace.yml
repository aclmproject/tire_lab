name: Release Tire Lab v0.7.0 Validation Workspace
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v070-validation-workspace
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "0.7.0"
      PREVIOUS_VERSION: "0.6.6"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build integrated validation workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          core=r'''"use strict";
          (function(root){
           const clamp=(x,a,b)=>Math.max(a,Math.min(b,Number(x)));
           const finite=x=>Number.isFinite(Number(x));
           const mean=a=>a.length?a.reduce((s,x)=>s+Number(x),0)/a.length:NaN;
           const basename=p=>String(p||"").replace(/\\/g,"/").split("/").filter(Boolean).pop()?.toLowerCase()||"";
           function csvLine(line,delimiter){const out=[];let value="",quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&quoted&&line[i+1]==='"'){value+='"';i++;}else if(ch==='"')quoted=!quoted;else if(ch===delimiter&&!quoted){out.push(value.trim());value="";}else value+=ch;}out.push(value.trim());return out;}
           function parseTelemetry(text){
            const lines=String(text||"").replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw new Error("Telemetry CSV needs a header and at least one data row.");
            const first=lines[0],delimiters=[",",";","\t"],delimiter=delimiters.sort((a,b)=>(first.split(b).length-first.split(a).length))[0],headers=csvLine(first,delimiter).map((h,i)=>h||("column_"+i));
            const rows=lines.slice(1).map(line=>csvLine(line,delimiter)).filter(r=>r.length>1).map(values=>{const row={};headers.forEach((h,i)=>row[h]=values[i]??"");return row;});return {delimiter,headers,rows};
           }
           function findHeader(headers,patterns){return headers.find(h=>patterns.some(p=>p.test(String(h).toLowerCase())))||null;}
           function telemetrySummary(dataset){
            const h=dataset.headers,xHeader=findHeader(h,[/^distance/,/lap.?distance/,/^time/,/^lap$/]),speedHeader=findHeader(h,[/^speed/,/vehicle.?speed/,/velocity/]);
            const tempHeaders=h.filter(x=>/(temp|temperature)/i.test(x)&&/(tyre|tire|wheel|fl|fr|rl|rr|front|rear)/i.test(x)),frontHeaders=tempHeaders.filter(x=>/(fl|fr|front)/i.test(x)),rearHeaders=tempHeaders.filter(x=>/(rl|rr|rear)/i.test(x)),pressureHeaders=h.filter(x=>/(press|psi)/i.test(x)&&/(tyre|tire|wheel|fl|fr|rl|rr|front|rear)/i.test(x));
            const points=[],speeds=[],allTemps=[];dataset.rows.forEach((row,i)=>{const x=finite(row[xHeader])?Number(row[xHeader]):i,fv=frontHeaders.map(k=>Number(row[k])).filter(Number.isFinite),rv=rearHeaders.map(k=>Number(row[k])).filter(Number.isFinite),av=tempHeaders.map(k=>Number(row[k])).filter(Number.isFinite);if(av.length)allTemps.push(...av);if(finite(row[speedHeader]))speeds.push(Number(row[speedHeader]));if(fv.length||rv.length)points.push({x,front:mean(fv),rear:mean(rv)});});
            return {rows:dataset.rows.length,xHeader,speedHeader,tempHeaders,pressureHeaders,points,averageSpeed:mean(speeds),averageTemperature:mean(allTemps),minimumTemperature:allTemps.length?Math.min(...allTemps):NaN,maximumTemperature:allTemps.length?Math.max(...allTemps):NaN,mappingConfidence:tempHeaders.length>=4?"high":tempHeaders.length>=2?"medium":"low"};
           }
           function parseIni(text){const out={};let section=null;String(text||"").replace(/^\uFEFF/,"").split(/\r?\n/).forEach(raw=>{const line=raw.trim();if(!line||line.startsWith(";")||line.startsWith("#"))return;const sm=line.match(/^\[([^\]]+)\]/);if(sm){section=sm[1].trim().toUpperCase();out[section]=out[section]||{};return;}if(!section||!line.includes("="))return;const pos=line.indexOf("="),key=line.slice(0,pos).trim().toUpperCase();out[section][key]=line.slice(pos+1).split(";")[0].trim();});return out;}
           function fileByBase(files,name){const key=Object.keys(files||{}).find(k=>basename(k)===String(name).toLowerCase());return key?{path:key,text:files[key]}:null;}
           function lengthKm(value){const text=String(value||"").replace(",",".");const m=text.match(/(\d+(?:\.\d+)?)\s*(km|m|mi|mile)/i);if(!m)return NaN;const x=Number(m[1]),u=m[2].toLowerCase();return u==="m"?x/1000:(u.startsWith("mi")?x*1.609344:x);}
           function parseTrackFiles(files,label){
            const ui=fileByBase(files,"ui_track.json"),surfaces=fileByBase(files,"surfaces.ini"),models=Object.keys(files||{}).filter(k=>/^models.*\.ini$/i.test(basename(k)));let meta={};try{if(ui)meta=JSON.parse(ui.text);}catch(e){}
            let len=lengthKm(meta.length),lengthSource=finite(len)?"ui_track.json":"unresolved";if(!finite(len))len=lengthKm(meta.description);if(finite(len)&&lengthSource==="unresolved")lengthSource="ui_track.json description";
            const s=parseIni(surfaces?.text||""),surfaceRows=Object.entries(s).filter(([k])=>/^SURFACE/.test(k)).map(([id,x])=>({id,key:x.KEY||id,friction:finite(x.FRICTION)?Number(x.FRICTION):NaN,damping:finite(x.DAMPING)?Number(x.DAMPING):0,wav:finite(x.WAV)?Number(x.WAV):0,sinHeight:finite(x.SIN_HEIGHT)?Number(x.SIN_HEIGHT):0,valid:String(x.IS_VALID_TRACK||"1")!=="0"}));
            const frictions=surfaceRows.filter(x=>x.valid&&finite(x.friction)).map(x=>x.friction),roughness=mean(surfaceRows.map(x=>Math.abs(x.wav)+Math.abs(x.sinHeight)*10).filter(Number.isFinite)),meanFriction=finite(mean(frictions))?mean(frictions):1.0,assumedLength=finite(len)?len:4.0,energyScore=clamp(0.52+assumedLength*0.105+(meanFriction-0.95)*0.7+(finite(roughness)?roughness:0)*0.035,0.55,1.75);
            return {label:label||meta.name||"Imported track",name:meta.name||label||"Imported track",country:meta.country||"",city:meta.city||"",lengthKm:assumedLength,lengthSource,surfaceCount:surfaceRows.length,meanFriction,roughness:finite(roughness)?roughness:0,modelFiles:models.length,energyScore,surfaces:surfaceRows,directEvidence:[ui?"track identity metadata":"track identity unavailable",surfaces?"surface physics parsed":"surface physics unavailable",finite(len)?"track length parsed":"track length fallback used"],inferredEvidence:["energy score combines length, mean surface friction and roughness","KN5 geometry, elevation and exact corner sequence are not decoded"]};
           }
           function simulateThermal(options){
            const track=options.track||{lengthKm:4,energyScore:1},laps=clamp(options.laps||10,1,200),avgSpeed=clamp(options.avgSpeed||120,20,350),ambient=clamp(options.ambient||20,-20,60),trackTemp=clamp(options.trackTemp||30,-10,90),aggression=clamp(options.aggression||1,0.5,1.6),lapTime=track.lengthKm/avgSpeed*3600,sink=(ambient+trackTemp)/2,rows=[];
            for(const comp of options.compounds||[])for(const axle of ["front","rear"]){const intensity=Number(axle==="front"?comp.loadF:comp.loadR)||11,target=Number(comp.target)||80,cooling=clamp(Number(comp.cool)||1,0.6,2.2);let temp=finite(options.blankets)&&Number(options.blankets)>0?Number(options.blankets):trackTemp,peak=temp,warmLap=null,series=[];for(let lap=1;lap<=laps;lap++){const heat=8.2*track.energyScore*aggression*(intensity/11)*Math.pow(Math.max(45,lapTime)/100,0.22),coolRate=clamp(0.115*cooling*Math.pow(100/Math.max(45,lapTime),0.16),0.055,0.28);temp+=heat-(temp-sink)*coolRate;peak=Math.max(peak,temp);if(warmLap===null&&Math.abs(temp-target)<=8)warmLap=lap;series.push({lap,temp:Number(temp.toFixed(2))});}const end=temp,status=peak>target+18?"overheat risk":end<target-12?"slow warm-up":"working-window candidate";rows.push({compound:comp.key,name:comp.name,axle,target,lapTime:Number(lapTime.toFixed(1)),warmLap,peak:Number(peak.toFixed(1)),end:Number(end.toFixed(1)),status,series});}
            return {model:"ACLM reduced-order screening model 1.0",track,laps,avgSpeed,ambient,trackTemp,aggression,rows,limitations:["not a lap-time solver","requires telemetry calibration","aero load is represented only through the selected FZ0 factor"]};
           }
           function balanceRecommendations(sim){const out=[],groups={};for(const row of sim?.rows||[]){groups[row.compound]=groups[row.compound]||{};groups[row.compound][row.axle]=row;}for(const [comp,g] of Object.entries(groups)){if(!g.front||!g.rear)continue;const delta=g.front.end-g.rear.end;out.push({compound:comp,delta:Number(delta.toFixed(1)),status:Math.abs(delta)<=5?"balanced screening result":"review axle balance",recommendation:Math.abs(delta)<=5?"retain baseline and validate telemetry":delta>0?"front hotter: inspect front pressure/camber/slip and brake heat; consider slightly more front cooling":"rear hotter: inspect rear pressure, driven slip and rear load; consider slightly more rear cooling"});}return out;}
           function pressureCamberSweep(options){const results=[],ideal=Number(options.idealHot)||27,ref=Number(options.referenceTemp)||26,target=Number(options.targetTemp)||80,basePressure=Number(options.coldPressure)||21,baseCamber=Number(options.camber)||-2,construction=options.construction||"radial",idealCamber=construction==="bias"?-1.4:-2.5;for(let dp=-3;dp<=3;dp++)for(let dc=-2;dc<=2;dc++){const cold=basePressure+dp,camber=baseCamber+dc*.5,hot=(cold+14.7)*(target+273.15)/(ref+273.15)-14.7,score=Math.abs(hot-ideal)*3+Math.abs(camber-idealCamber)*1.4;results.push({coldPsi:Number(cold.toFixed(1)),camberDeg:Number(camber.toFixed(1)),predictedHotPsi:Number(hot.toFixed(1)),score:Number(score.toFixed(2))});}return results.sort((a,b)=>a.score-b.score).slice(0,8);}
           function stintStrategy(options){const trackKm=Number(options.trackKm)||4,laps=Math.max(1,Number(options.laps)||20),out=[];for(const comp of options.compounds||[]){const life=Number(comp.lifeKm)||Math.max(40,trackKm*laps*.75),usable=Math.max(trackKm,life*.82),window=Math.max(1,Math.floor(usable/trackKm));out.push({compound:comp.key,name:comp.name,lifeKm:Number(life.toFixed(1)),recommendedLaps:window,stops:Math.max(0,Math.ceil(laps/window)-1),warmupLaps:comp.warmLap??null,confidence:Number(comp.lifeKm)>0?"class-life prior":"fallback estimate"});}return out;}
           function compareTirePacks(filesA,filesB){const a=fileByBase(filesA,"tyres.ini"),b=fileByBase(filesB,"tyres.ini");if(!a||!b)throw new Error("Both ZIPs must contain tyres.ini.");const ai=parseIni(a.text),bi=parseIni(b.text),sections=[...new Set([...Object.keys(ai),...Object.keys(bi)])].sort(),diffs=[];for(const section of sections){const keys=[...new Set([...Object.keys(ai[section]||{}),...Object.keys(bi[section]||{})])].sort();for(const key of keys){const av=ai[section]?.[key]??"",bv=bi[section]?.[key]??"";if(av!==bv)diffs.push({section,key,a:av,b:bv});}}return {sectionsA:Object.keys(ai).length,sectionsB:Object.keys(bi).length,differenceCount:diffs.length,differences:diffs.slice(0,250)};}
           const TEST_CARS=Object.freeze([
            {id:"escort_mk1_g2",name:"Ford Escort Mk1 Group 2",year:1972,mass:870,frontWeight:54,fzFactor:1.07,fw:.205,rw:.235,construction:"bias",seriesKeywords:["touring","group 2"],expected:"Front medium duty, rear light/medium boundary; race tire should warm progressively without a modern slick target."},
            {id:"lotus_49",name:"Lotus 49",year:1967,mass:500,frontWeight:40,fzFactor:1.05,fw:.190,rw:.250,construction:"bias",seriesKeywords:["formula","f1"],expected:"Light axle duty and slow hard-tire warm-up; bias-ply response should dominate."},
            {id:"porsche_917k",name:"Porsche 917K",year:1970,mass:800,frontWeight:42,fzFactor:1.18,fw:.260,rw:.360,construction:"bias",seriesKeywords:["prototype","sports"],expected:"Light static-width duty but meaningful speed load; track-energy and FZ factor sensitivity should be obvious."},
            {id:"bmw_e30_gpa",name:"BMW M3 E30 Group A",year:1989,mass:960,frontWeight:52,fzFactor:1.08,fw:.240,rw:.240,construction:"radial",seriesKeywords:["group a","touring"],expected:"Medium and relatively balanced axle duty; a useful baseline for temperature symmetry."},
            {id:"mclaren_f1_gtr",name:"McLaren F1 GTR",year:1995,mass:1120,frontWeight:43,fzFactor:1.15,fw:.265,rw:.315,construction:"radial",seriesKeywords:["bpr","gt1","le mans gt"],expected:"Medium duty with rear energy sensitivity; endurance compound should stabilize over a longer stint."},
            {id:"porsche_911_gt1",name:"Porsche 911 GT1",year:1998,mass:950,frontWeight:40,fzFactor:1.22,fw:.285,rw:.335,construction:"radial",seriesKeywords:["gt1","fia gt"],expected:"Front warm-up may lag the rear; speed-load factor materially changes the result."},
            {id:"mazda_787b",name:"Mazda 787B",year:1991,mass:830,frontWeight:43,fzFactor:1.22,fw:.300,rw:.355,construction:"radial",seriesKeywords:["group c","c1"],expected:"Low static-width duty with high circuit-energy dependence; validate using long-run telemetry."},
            {id:"formula_ford",name:"Formula Ford 1600",year:1970,mass:420,frontWeight:44,fzFactor:1.03,fw:.155,rw:.185,construction:"bias",seriesKeywords:["formula ford","junior"],expected:"Very light car but narrow tires; moderate N/mm duty and strong sensitivity to treaded-control construction."}
           ]);
           function researchPacket(entry,history){return {product:"ACLM Community Tire Research Submission",schemaVersion:"1.0.0",exportedUtc:new Date().toISOString(),entry,reviewHistory:history||[],policy:["publicly citeable evidence only","no confidential or proprietary information","maintainer review required before knowledge inclusion"]};}
           root.ACLMValidationCore={parseTelemetry,telemetrySummary,parseIni,parseTrackFiles,simulateThermal,balanceRecommendations,pressureCamberSweep,stintStrategy,compareTirePacks,TEST_CARS,researchPacket};
          })(typeof window!=="undefined"?window:globalThis);
          '''
          workspace=r'''"use strict";
          (function(){
           const core=window.ACLMValidationCore;if(!core)return;
           const state={track:null,telemetry:null,simulation:null,balance:[],sweep:[],strategy:[],comparison:null,testProfile:null,research:[]},e=id=>document.getElementById(id),esc=s=>escapeHtml(String(s??"")),num=id=>Number(e(id)?.value);
           function table(headers,rows){return "<table><thead><tr>"+headers.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+esc(x)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";}
           function download(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:type||"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200);}
           function selectedModelCompounds(){return selectedCompounds().map(key=>{const prior=activeFamilyPrior(),base=key==="soft"?1.08:key==="hard"?.92:1;return {key,name:compoundDisplayName(key),target:targetTempForCompound(key),loadF:loadDuty("front").intensity,loadR:loadDuty("rear").intensity,cool:prior&&dryCompound(key)?Number(prior.cool):base,lifeKm:historicalLifeKm(key)};});}
           function drawTelemetry(){const c=e("telemetryOverlay"),summary=state.telemetry;if(!c||!summary)return;const rect=c.getBoundingClientRect(),w=Math.max(420,Math.floor(rect.width||650)),h=230,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle="#0b1016";ctx.fillRect(0,0,w,h);const pts=summary.points;if(!pts.length){ctx.fillStyle="#9aa7b5";ctx.fillText("No mapped tire-temperature columns",20,30);return;}const vals=pts.flatMap(p=>[p.front,p.rear]).filter(Number.isFinite),min=Math.min(...vals)-3,max=Math.max(...vals)+3,x0=45,y0=20,pw=w-65,ph=h-55;ctx.strokeStyle="#34404d";for(let i=0;i<=4;i++){const y=y0+ph*i/4;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+pw,y);ctx.stroke();}function series(key,color){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();let started=false;pts.forEach((p,i)=>{if(!Number.isFinite(p[key]))return;const x=x0+pw*i/Math.max(1,pts.length-1),y=y0+ph-(p[key]-min)/(max-min)*ph;if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);});ctx.stroke();}series("front","#43b4ff");series("rear","#ffb347");ctx.fillStyle="#dbe5ef";ctx.fillText("Telemetry tire temperature — front (blue) / rear (orange)",x0,14);ctx.fillText(min.toFixed(0)+" C",5,y0+ph);ctx.fillText(max.toFixed(0)+" C",5,y0+8);}
           async function importTrack(){const file=e("trackZip")?.files?.[0];if(!file)return;e("trackStatus").textContent="Reading track ZIP...";try{const files=await readZipPhysics(file);state.track=core.parseTrackFiles(files,file.name);const t=state.track;e("trackStatus").innerHTML="<span class=\"ok\"><b>Track parsed:</b></span> "+esc(t.name)+" · "+t.lengthKm.toFixed(3)+" km ("+esc(t.lengthSource)+") · "+t.surfaceCount+" surfaces · mean friction "+t.meanFriction.toFixed(3)+" · inferred energy "+t.energyScore.toFixed(2)+".<br><span class=\"muted\">Direct: "+esc(t.directEvidence.join("; "))+". Inferred: "+esc(t.inferredEvidence.join("; "))+".</span>";e("trackName").value=t.name;e("trackLength").value=t.lengthKm.toFixed(3);e("trackEnergy").value=t.energyScore.toFixed(2);}catch(err){e("trackStatus").innerHTML="<span class=\"error\">"+esc(err.message)+"</span>";}}
           async function importTelemetry(){const file=e("telemetryCsv")?.files?.[0];if(!file)return;try{const parsed=core.parseTelemetry(await file.text());state.telemetry=core.telemetrySummary(parsed);const s=state.telemetry;e("telemetryStatus").innerHTML="<span class=\"ok\"><b>Telemetry mapped:</b></span> "+s.rows+" rows · "+s.tempHeaders.length+" temperature columns · confidence "+esc(s.mappingConfidence)+" · average "+(Number.isFinite(s.averageTemperature)?s.averageTemperature.toFixed(1)+" C":"unavailable")+".";drawTelemetry();renderEvidence();}catch(err){e("telemetryStatus").innerHTML="<span class=\"error\">"+esc(err.message)+"</span>";}}
           function currentTrack(){return state.track||{name:e("trackName").value||"Manual track",lengthKm:num("trackLength")||4,energyScore:num("trackEnergy")||1,lengthSource:"manual",meanFriction:1,surfaceCount:0};}
           function runSimulation(){const compounds=selectedModelCompounds();if(!compounds.length){e("simulationResults").innerHTML="<span class=\"error\">Select a compound.</span>";return;}state.simulation=core.simulateThermal({track:currentTrack(),laps:num("simLaps"),avgSpeed:num("simSpeed"),ambient:num("simAmbient"),trackTemp:num("simTrackTemp"),aggression:num("simAggression"),blankets:n("blankets"),compounds});state.balance=core.balanceRecommendations(state.simulation);e("simulationResults").innerHTML=table(["Compound","Axle","Target","Warm lap","Peak","Finish","Assessment"],state.simulation.rows.map(r=>[r.name,r.axle,r.target.toFixed(0)+" C",r.warmLap??"not reached",r.peak+" C",r.end+" C",r.status]));e("balanceResults").innerHTML=table(["Compound","F-R finish","Assessment","Recommendation"],state.balance.map(x=>[compoundDisplayName(x.compound),x.delta+" C",x.status,x.recommendation]));runStrategy();renderEvidence();}
