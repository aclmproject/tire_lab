           e("trackZip").addEventListener("change",importTrack);e("telemetryCsv").addEventListener("change",importTelemetry);e("runTrackSimulation").addEventListener("click",runSimulation);e("runSweep").addEventListener("click",runSweep);e("runStrategy").addEventListener("click",runStrategy);e("comparePacks").addEventListener("click",comparePacks);e("applyTestProfile").addEventListener("click",applyTest);e("addResearchDraft").addEventListener("click",addResearch);e("advanceResearch").addEventListener("click",()=>{const id=state.research.at(-1)?.id;if(id)advanceResearch(id);});e("exportResearchPackets").addEventListener("click",exportResearch);["trackLength","trackEnergy","simLaps","simSpeed","simAmbient","simTrackTemp","simAggression"].forEach(id=>e(id).addEventListener("input",renderEvidence));
