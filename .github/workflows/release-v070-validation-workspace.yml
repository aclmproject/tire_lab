      - name: Validate validation workspace
        shell: bash
        run: |
          set -euo pipefail
          node --check src/payload/app/app.js
          node --check src/payload/app/validation_core.js
          node --check src/payload/app/validation_workspace.js
          node --check src/payload/app/sw.js
          pwsh -NoLogo -NoProfile -Command '& { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("src/payload/Server_ACLM_Tire_Lab.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if($errors.Count){$errors | ForEach-Object { Write-Error $_ }; exit 1} }'
          node <<'JS'
          const fs=require("fs"),vm=require("vm");vm.runInThisContext(fs.readFileSync("src/payload/app/validation_core.js","utf8"));const c=globalThis.ACLMValidationCore;if(!c)throw Error("core missing");
          const ts=c.telemetrySummary(c.parseTelemetry("lap,speed,tyre_temp_fl,tyre_temp_fr,tyre_temp_rl,tyre_temp_rr\n1,120,70,71,68,69\n2,125,74,75,72,73"));if(ts.rows!==2||ts.tempHeaders.length!==4)throw Error("telemetry parse");
          const track=c.parseTrackFiles({"ui/ui_track.json":JSON.stringify({name:"Zolder",length:"4.011 km"}),"data/surfaces.ini":"[SURFACE_0]\nKEY=ROAD\nFRICTION=0.98\nWAV=0.02\nIS_VALID_TRACK=1\n"},"zolder.zip");if(Math.abs(track.lengthKm-4.011)>.001||track.surfaceCount!==1)throw Error("track parse");
          const sim=c.simulateThermal({track,laps:10,avgSpeed:125,ambient:22,trackTemp:30,aggression:1,blankets:70,compounds:[{key:"race",name:"Race",target:82,loadF:12,loadR:9,cool:1}]});if(sim.rows.length!==2||!sim.rows.every(x=>Number.isFinite(x.end)))throw Error("simulation");
          if(c.pressureCamberSweep({idealHot:27,referenceTemp:26,targetTemp:82,coldPressure:21,camber:-2,construction:"bias"}).length!==8)throw Error("sweep");
          if(c.compareTirePacks({"tyres.ini":"[HEADER]\nVERSION=10\n"},{"tyres.ini":"[HEADER]\nVERSION=9\n"}).differenceCount!==1)throw Error("diff");
          if(c.TEST_CARS.length<8)throw Error("test library");console.log("validation core tests passed");
