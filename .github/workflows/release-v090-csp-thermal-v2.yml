name: Release Tire Lab v0.9.0 CSP Thermal V2
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v090-csp-thermal-v2.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  APP_VERSION: 0.9.0
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Full CSP Thermal V2 regression suite
        shell: bash
        run: |
          set -euo pipefail
          for file in src/payload/app/*.js; do node --check "$file"; done
          node --check tests/telemetry_ui_fixture_server.mjs
          node --test tests/thermal_v2.test.js
          pwsh -NoLogo -NoProfile -File src/payload/Telemetry/ACLM_Native_Telemetry_Logger.ps1 -SelfTest
          pwsh -NoLogo -NoProfile -Command '& { $t=$null;$e=$null;[Management.Automation.Language.Parser]::ParseFile("src/payload/Server_ACLM_Tire_Lab.ps1",[ref]$t,[ref]$e)|Out-Null;if($e.Count){$e|ForEach-Object{Write-Error $_};exit 1} }'
          python3 - <<'PY'
          from pathlib import Path
          app=Path('src/payload/app/app.js').read_text()
          html=Path('src/payload/app/index.html').read_text()
          thermal=Path('src/payload/app/thermal_v2.js').read_text()
          assert 'const ACLM_APP_VERSION="0.9.0";' in app
          assert '<b id="installedBuild">v0.9.0</b>' in html
          assert '<option value="csp-v2" selected>CSP Extended Physics – Thermal V2</option>' in html
          assert '[THERMAL_MODEL]' in app and 'VERSION=2' in app
          assert 'THERMAL2_' in thermal
          assert 'CORE_TRANSFER=0' in thermal and 'INTERNAL_CORE_TRANSFER=0' in thermal and 'ROLLING_K=0' in thermal
          assert 'ACLM_THERMAL_V2_CALIBRATION.json' in app
          assert 'updateCarIni' in thermal and 'validateCarIni' in thermal
          print('v0.9.0 CSP Thermal V2 release gates passed')
          PY
      - name: Package, publish, and align manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os,zipfile
          v=os.environ['APP_VERSION'];name=f'ACLM_Tire_Lab_Setup_v{v}.zip';archive=Path('/tmp')/name
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
           for p in sorted(Path('src').rglob('*')):
            if p.is_file(): z.write(p,p.relative_to('src').as_posix())
          sha=hashlib.sha256(archive.read_bytes()).hexdigest()
          pub=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          notes='Implements real CSP Thermal Model V2 output with physical heat-pathway reconstruction, matching THERMAL2 sections, car.ini extended-2 validation and calibration manifests. Vanilla and wear paths are preserved.'
          manifest={'product':'ACLM Historical Tire Lab','channel':'stable','version':v,'file_name':name,'release_page':f'https://github.com/aclmproject/tire_lab/releases/tag/v{v}','download_url':f'https://github.com/aclmproject/tire_lab/releases/download/v{v}/{name}','sha256':sha,'published_utc':pub,'notes':notes}
          Path('manifests/ACLM_Tire_Lab_latest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('/tmp/app_sha').write_text(sha)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/ACLM_Tire_Lab_latest.json
          git diff --cached --quiet || git commit -m "release: align v0.9.0 installer manifest"
          git push origin HEAD:main
          sha="$(cat /tmp/app_sha)"
          notes="Real CSP Thermal Model V2 output: THERMAL_MODEL VERSION=2, Kunos THERMAL plus matching THERMAL2 sections, zero obsolete controls, physical heat-pathway priors, safe car.ini extended-2 handling, calibration manifest, BRM and cross-era regressions. Vanilla and wear paths are preserved. SHA-256: $sha"
          if gh release view "v$APP_VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v$APP_VERSION" "/tmp/ACLM_Tire_Lab_Setup_v$APP_VERSION.zip" manifests/ACLM_Tire_Lab_latest.json docs/CSP_Thermal_V2_Architecture_v090.md docs/Engineering_Report_CSP_Thermal_V2_v090.md --clobber --repo "${{ github.repository }}"
            gh release edit "v$APP_VERSION" --draft=false --title "ACLM Historical Tire Lab v$APP_VERSION" --notes "$notes" --repo "${{ github.repository }}"
            gh release edit "v$APP_VERSION" --latest --repo "${{ github.repository }}"
          else
            gh release create "v$APP_VERSION" "/tmp/ACLM_Tire_Lab_Setup_v$APP_VERSION.zip" manifests/ACLM_Tire_Lab_latest.json docs/CSP_Thermal_V2_Architecture_v090.md docs/Engineering_Report_CSP_Thermal_V2_v090.md --target "$(git rev-parse HEAD)" --title "ACLM Historical Tire Lab v$APP_VERSION" --notes "$notes" --repo "${{ github.repository }}"
          fi
