name: Publish Tire Knowledge 1.7.0 historical categories
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-knowledge-170.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-knowledge-170
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Build and validate additive release
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/payload.json
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,re
          root=Path("knowledge"); base=json.loads((root/"releases/ACLM_Tire_Knowledge_v1.6.0.json").read_text()); p=json.loads(Path("/tmp/payload.json").read_text())
          d=json.loads(json.dumps(base)); d["families"]+=p["families"]; d["classes"]+=p["classes"]; d["generatorPriors"].update(p["priors"]); d["releaseVersion"]="1.7.0"; pub=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z"); d["publishedUtc"]=pub
          d["releaseNotes"]=["Workbook-derived historical category expansion: 12 new families and 28 selectable subclasses spanning 1966-2000.","Adds Can-Am, period F2/Atlantic, IMSA GTU/GTO and GTS, NASCAR venue/construction branches, Super Touring, WSC, JGTC, CART, period WRC and BPR GT1/GT2 sprint/endurance.","Aggregate turbo-F1 was excluded because v1.6.0 already has a stronger chronology; oval and gravel are separate architectures, not compound kinds.","All numerical additions are evidence-weighted reconstruction priors, not confidential or proprietary coefficients."]+base.get("releaseNotes",[])
          canon=lambda x:json.dumps(x,sort_keys=True,separators=(",",":"),ensure_ascii=False)
          by=lambda a:{x["id"]:x for x in a}
          for key in ("families","classes","measurements"):
            ids=[x["id"] for x in d[key]]
            assert len(ids)==len(set(ids)),key
          assert (len(d["families"]),len(d["classes"]),len(d["sources"]),len(d["measurements"]))==(85,101,145,184)
          assert all(c["familyId"] in by(d["families"]) and c["menu"] for c in d["classes"])
          assert set(d["generatorPriors"])==set(by(d["families"]))
          assert all(k in by(d["families"]) and canon(v)==canon(by(d["families"])[k]) for k,v in by(base["families"]).items())
          assert all(k in by(d["classes"]) and canon(v)==canon(by(d["classes"])[k]) for k,v in by(base["classes"]).items())
          allowed={"soft","qualifying","race","control","dry","hard","endurance","intermediate","wet","wet_hard"}; assert all(m["kind"] in allowed for c in d["classes"] for m in c["menu"])
          src=set(d["sources"])
          def refs(x):
            if isinstance(x,list): return sum((refs(v) for v in x),[])
            if isinstance(x,dict): return ([x["sourceId"]] if isinstance(x.get("sourceId"),str) else [])+(x.get("sourceIds",[]) if isinstance(x.get("sourceIds"),list) else [])+sum((refs(v) for v in x.values()),[])
            return []
          assert set(refs(d))<=src
          cv={k:v for k,v in d.items() if k!="contentSha256"}; csha=hashlib.sha256(canon(cv).encode()).hexdigest(); d["contentSha256"]=csha
          rp=root/"releases/ACLM_Tire_Knowledge_v1.7.0.json"; rp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n"); rsha=hashlib.sha256(rp.read_bytes()).hexdigest()
          val={"version":"1.7.0","schemaVersion":d["schemaVersion"],"families":85,"classes":101,"sources":145,"measurements":184,"familiesAdded":12,"classesAdded":28,"sha256":rsha,"contentSha256":csha,"sourceWorkbook":p["provenance"],"checks":{"uniqueIds":True,"references":True,"priorCoverage":True,"supportedMenus":True,"v1.6Lineage":True}}
          (root/"releases/ACLM_Tire_Knowledge_v1.7.0_validation.json").write_text(json.dumps(val,indent=2)+"\n")
          ptr={"product":"ACLM Tire Knowledge","channel":"stable","schema_version":d["schemaVersion"],"version":"1.7.0","file_name":rp.name,"release_page":"https://github.com/aclmproject/tire_lab/releases/tag/knowledge-v1.7.0","download_url":"https://github.com/aclmproject/tire_lab/releases/download/knowledge-v1.7.0/"+rp.name,"sha256":rsha,"release_content_sha256":csha,"published_utc":pub,"notes":"Additive historical categories: 85 families and 101 selectable classes; v1.6 lineage preserved."}
          (root/"ACLM_Tire_Knowledge_latest.json").write_text(json.dumps(ptr,indent=2)+"\n")
          q=Path("README.md"); t=q.read_text(); t,n=re.subn(r"Current knowledge release: \*\*v1\.6\.0\*\* \(schema 1\.2\.0\)","Current knowledge release: **v1.7.0** (schema 1.2.0)",t,1); assert n or "v1.7.0" in t; q.write_text(t)
          Path("/tmp/rsha").write_text(rsha); Path("/tmp/csha").write_text(csha); print(json.dumps(val,indent=2))
          PY
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge README.md
          if ! git diff --cached --quiet; then git commit -m "release: Tire Knowledge v1.7.0 historical categories"; git push origin HEAD:main; fi
          if ! gh release view knowledge-v1.7.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create knowledge-v1.7.0 knowledge/releases/ACLM_Tire_Knowledge_v1.7.0.json knowledge/releases/ACLM_Tire_Knowledge_v1.7.0_validation.json --repo "${{ github.repository }}" --target main --title "ACLM Tire Knowledge v1.7.0" --notes "12 new families and 28 selectable historical subclasses. v1.6.0 lineage is preserved; overlapping turbo-F1 aggregate excluded. Numerical values remain reconstruction priors. Raw SHA: $(cat /tmp/rsha). Content SHA: $(cat /tmp/csha)." --latest=false
          fi
